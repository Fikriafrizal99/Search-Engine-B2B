name: Bukupay CI

on:
  push:
    branches: [main-bukupay]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Check dependencies
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/collector ./cmd/dashboard
