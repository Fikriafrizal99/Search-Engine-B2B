name: B2B CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go mod tidy
      - run: gofmt -w . && git diff --exit-code
      - run: go test ./...
      - run: go build ./cmd/collector ./cmd/dashboard
