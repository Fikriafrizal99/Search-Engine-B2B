services:
  search-engine-b2b:
    build:
      context: .
      dockerfile: Dockerfile
    image: search-engine-b2b:local
    container_name: search-engine-b2b
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    stop_grace_period: 20s
