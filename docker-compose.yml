services:
  search-engine-b2b:
    build:
      context: .
      dockerfile: Dockerfile
    image: search-engine-b2b:local
    container_name: search-engine-b2b
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "8081:8081"
    environment:
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    volumes:
      - ./data:/app/data
    stop_grace_period: 20s

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: bukupay-osrm
    profiles: ["routing"]
    restart: unless-stopped
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "1000"
      - /data/java-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data:ro
